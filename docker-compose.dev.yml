services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    ports:
      - "3000:3000"
    env_file:
      - .env.dev
    volumes:
      - .:/app
    command: ["sh", "-c", "if [ -f package.json ]; then yarn install --immutable; fi; bundle exec rails db:prepare && bundle exec rails server -b 0.0.0.0 -p 3000"]
volumes:
  node_modules:

